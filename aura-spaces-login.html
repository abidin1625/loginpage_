<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Spaces — Sign In</title>

  <!-- Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       Aura Spaces — Login Page
       Satu file: HTML + CSS (tanpa JavaScript)
       Toggle password memakai trik checkbox murni CSS
       ============================================================ */

    /* ---------- RESET ---------- */
    *,
    *::before,
    *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-panel:  #1B221C;                 /* panel hijau tua      */
      --sage:      #B2CBA9;                 /* tombol Sign In       */
      --sage-deep: #C3D8BB;
      --green-soft:#A6C9A1;                 /* link / aksen         */
      --check:     #8FBC8A;                 /* kotak centang        */
      --ink:       #F2F5F0;                 /* teks utama           */
      --desc:      #B7C2B4;                 /* teks deskripsi       */
      --muted:     #93A292;                 /* teks redup           */
      --line:      rgba(255, 255, 255, 0.14);
      --input-border: #3A453C;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
      background: #121711;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: rgba(166, 201, 161, 0.35); }

    /* ---------- LAYOUT UTAMA ---------- */
    .page {
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ---------- KIRI : FOTO INTERIOR ---------- */
    .hero {
      flex: 0 0 55%;
      position: relative;
      overflow: hidden;
    }

    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* gradasi halus agar transisi ke panel terasa lembut */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(18, 23, 17, 0.08) 55%, rgba(18, 23, 17, 0.45) 100%);
      pointer-events: none;
    }

    /* ---------- KANAN : PANEL LOGIN ---------- */
    .panel {
      flex: 1 1 45%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 48px;
      background: radial-gradient(120% 120% at 15% 0%, #212A20 0%, #1B221C 48%, #161C16 100%);
    }

    .panel-inner {
      width: min(440px, 100%);
    }

    /* --- kepala panel --- */
    .brand { text-align: center; }

    .brand h1 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    .welcome {
      margin-top: 6px;
      font-size: 14px;
      color: var(--green-soft);
    }

    .head { text-align: center; margin: 26px 0 30px; }

    .head h2 {
      font-size: 33px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .desc {
      margin: 14px auto 0;
      max-width: 40ch;
      font-size: 14.5px;
      font-weight: 300;
      line-height: 1.7;
      color: var(--desc);
    }

    /* --- form --- */
    .field { margin-bottom: 22px; }

    .field > label {
      display: block;
      font-size: 14.5px;
      color: #E7ECE5;
      margin-bottom: 10px;
    }

    .input-box { position: relative; }

    .input-box .lead-icon {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      width: 19px;
      height: 19px;
      color: #8B988B;
      pointer-events: none;
    }

    .input-box input {
      width: 100%;
      height: 52px;
      padding: 0 48px 0 46px;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-box input::placeholder { color: #77837A; font-weight: 300; }

    .input-box input:focus {
      border-color: var(--green-soft);
      box-shadow: 0 0 0 3px rgba(166, 201, 161, 0.14);
    }

    /* --- toggle show/hide password (pure CSS, tanpa JS) --- */
    .show-pass {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* sandi ditampilkan sebagai titik-titik */
    .field-pass input { -webkit-text-security: disc; }

    /* saat checkbox dicentang → sandi terlihat */
    .show-pass:checked ~ .field-pass input { -webkit-text-security: none; }

    .toggle-pass {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #8B988B;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .toggle-pass:hover { color: var(--green-soft); background: rgba(255, 255, 255, 0.05); }
    .toggle-pass svg   { width: 20px; height: 20px; }
    .toggle-pass .eye-off { display: none; }

    .show-pass:checked ~ .field-pass .eye     { display: none; }
    .show-pass:checked ~ .field-pass .eye-off { display: block; }

    .show-pass:focus-visible ~ .field-pass .toggle-pass {
      outline: 2px solid var(--green-soft);
      outline-offset: 2px;
    }

    /* --- remember / forgot --- */
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 4px 0 30px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14.5px;
      color: #D5E0D2;
      cursor: pointer;
      user-select: none;
    }

    .remember input {
      appearance: none;
      -webkit-appearance: none;
      width: 19px;
      height: 19px;
      border-radius: 5px;
      border: 1.5px solid #5B6B5B;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .remember input::before {
      content: "";
      width: 10px;
      height: 5px;
      border-left: 2px solid #1B241B;
      border-bottom: 2px solid #1B241B;
      transform: rotate(-45deg) scale(0);
      transform-origin: center;
      transition: transform 0.15s ease;
    }

    .remember input:checked { background: var(--check); border-color: var(--check); }
    .remember input:checked::before { transform: rotate(-45deg) scale(1); }

    .forgot {
      font-size: 14.5px;
      color: var(--green-soft);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .forgot:hover { color: #C9DFC4; text-decoration: underline; text-underline-offset: 3px; }

    /* --- tombol Sign In --- */
    .btn-signin {
      position: relative;
      width: 100%;
      height: 58px;
      font: inherit;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: #24301F;
      background: var(--sage);
      border: none;
      border-radius: 29px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-signin:hover {
      background: var(--sage-deep);
      box-shadow: 0 12px 28px rgba(178, 203, 169, 0.18);
      transform: translateY(-1px);
    }

    .btn-signin:active { transform: translateY(1px); }

    .btn-signin .badge {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #22301F;
      color: #EAF2E7;
      transition: transform 0.2s ease;
    }

    .btn-signin:hover .badge { transform: translateY(-50%) rotate(45deg); }
    .btn-signin .badge svg { width: 18px; height: 18px; }

    /* --- pemisah --- */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 30px 0 24px;
      font-size: 13.5px;
      color: var(--muted);
      white-space: nowrap;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* --- tombol sosial --- */
    .socials {
      display: flex;
      gap: 14px;
    }

    .btn-social {
      flex: 1;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 26px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn-social:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .btn-social svg { width: 18px; height: 18px; }

    /* --- footer --- */
    .signup {
      margin-top: 30px;
      text-align: center;
      font-size: 15px;
      color: #C6CFC4;
    }

    .signup a {
      color: var(--green-soft);
      font-weight: 500;
      text-decoration: none;
    }
    .signup a:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 900px) {
      .page { flex-direction: column; }

      .hero { flex: none; height: 235px; }

      .panel { padding: 42px 26px; }
      .head { margin: 28px 0 30px; }
      .head h2 { font-size: 28px; }
      .signup { margin-top: 34px; }
    }

    @media (max-width: 420px) {
      .hero { height: 190px; }
      .panel { padding: 34px 18px; }
      .head h2 { font-size: 25px; }
      .desc { font-size: 14px; }
      .socials { flex-direction: column; }
      .btn-social { width: 100%; }
    }

    /* hormati preferensi pengguna yang mematikan animasi */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

          <input type="checkbox" id="showPass" class="show-pass" aria-label="Show password" />

          <div class="field field-pass">
            <label for="password">Password</label>
            <div class="input-box">
              <svg class="lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
                <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
                <circle cx="12" cy="15.5" r="1.4" fill="currentColor" stroke="none"/>
              </svg>
              <input type="text" id="password" name="password"
                     placeholder="Enter your password" autocomplete="current-password"
                     spellcheck="false" minlength="8" required />
              <label for="showPass" class="toggle-pass" title="Show / hide password">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.3 3.2"/>
                  <path d="M6.4 6.4A17.4 17.4 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.3-1"/>
                  <path d="M9.9 9.9a3 3 0 1 0 4.2 4.2"/>
                  <line x1="3" y1="3" x2="21" y2="21"/>
                </svg>
              </label>
            </div>
          </div>

          <div class="row">
            <label class="remember">
              <input type="checkbox" name="remember" checked />
              Remember Me
            </label>
            <a class="forgot" href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-signin">
            Sign In
            <span class="badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"/>
                <polyline points="8 7 17 7 17 16"/>
              </svg>
            </span>
          </button>

          <div class="divider">or continue with</div>

          <div class="socials">
            <button type="button" class="btn-social">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.57 5.57 0 0 1-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09A11.99 11.99 0 0 0 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.29A7.2 7.2 0 0 1 4.89 12c0-.8.14-1.57.38-2.29V6.62H1.29a12 12 0 0 0 0 10.76l3.98-3.09z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
              </svg>
              Google
            </button>

            <button type="button" class="btn-social">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="#FFFFFF">
                <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.702"/>
              </svg>
              Apple
            </button>
          </div>

        </form>

        <p class="signup">Don&rsquo;t have an account? <a href="#">Create Account</a></p>

      </div>
    </section>

  </main>

</body>
</html>
