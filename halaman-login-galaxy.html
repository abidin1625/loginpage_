  /* Kabut gelap tipis agar teks selalu terbaca */
  .veil{
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(1100px 620px at 50% 118%, rgba(6,182,212,.16), transparent 60%),
      radial-gradient(900px 540px at 108% -8%, rgba(139,92,246,.18), transparent 55%),
      linear-gradient(180deg, rgba(3,2,16,.42) 0%, rgba(3,2,16,.18) 45%, rgba(3,2,16,.55) 100%);
  }

  /* ================= BINTANG BERKELIP ================= */
  .stars{
    position:fixed; inset:0; z-index:-1;
    background-repeat:repeat;
    pointer-events:none;
  }
  .stars.a{
    background-image:
      radial-gradient(1.2px 1.2px at 40px 60px, #fff, transparent),
      radial-gradient(1px 1px at 180px 140px, #dbeafe, transparent),
      radial-gradient(1.4px 1.4px at 300px 40px, #fff, transparent),
      radial-gradient(1px 1px at 420px 200px, #a5f3fc, transparent),
      radial-gradient(1.2px 1.2px at 520px 90px, #fff, transparent),
      radial-gradient(1px 1px at 90px 320px, #e0e7ff, transparent),
      radial-gradient(1.3px 1.3px at 250px 400px, #fff, transparent),
      radial-gradient(1px 1px at 470px 360px, #c7d2fe, transparent),
      radial-gradient(1.1px 1.1px at 580px 300px, #fff, transparent);
    background-size:620px 460px;
    animation:twinkle 4.5s ease-in-out infinite;
    opacity:.85;
  }
  .stars.b{
    background-image:
      radial-gradient(1.6px 1.6px at 120px 220px, #fff, transparent),
      radial-gradient(1.8px 1.8px at 380px 120px, #cffafe, transparent),
      radial-gradient(1.5px 1.5px at 560px 420px, #fff, transparent),
      radial-gradient(1.7px 1.7px at 40px 470px, #e9d5ff, transparent),
      radial-gradient(1.5px 1.5px at 320px 540px, #fff, transparent);
    background-size:640px 620px;
    animation:twinkle 6.5s ease-in-out infinite reverse;
    opacity:.7;
  }
  @keyframes twinkle{
    0%,100%{opacity:.85}
    50%{opacity:.35}
  }

  /* Bintang jatuh sesekali */
  .meteor{
    position:fixed; top:16%; left:-12%; z-index:-1;
    width:150px; height:1.6px; border-radius:999px;
    background:linear-gradient(90deg, rgba(255,255,255,0), #e0f2fe 60%, #fff);
    transform:rotate(-24deg);
    animation:meteor 9s linear infinite;
    animation-delay:3s;
    pointer-events:none;
  }
  @keyframes meteor{
    0%  {transform:translate(-10vw,-6vh) rotate(-24deg); opacity:0}
    4%  {opacity:.9}
    10% {transform:translate(46vw,22vh) rotate(-24deg); opacity:0}
    100%{transform:translate(46vw,22vh) rotate(-24deg); opacity:0}
  }

  /* Cahaya nebula melayang */
  .orb{position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:-1}
  .orb.violet{
    width:430px; height:430px; top:-110px; right:-90px;
    background:rgba(124,58,237,.34);
    animation:float 19s ease-in-out infinite alternate;
  }
  .orb.cyan{
    width:380px; height:380px; bottom:-120px; left:-100px;
    background:rgba(34,211,238,.24);
    animation:float 24s ease-in-out infinite alternate-reverse;
  }
  @keyframes float{
    from{transform:translate(0,0)}
    to{transform:translate(46px,34px)}
  }

  /* ================= TATA LETAK ================= */
  .wrap{
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:48px 20px;
  }

  /* ================= KARTU KACA ================= */
  .card{
    width:100%; max-width:432px;
    padding:44px 40px 36px;
    border-radius:22px;
    background:linear-gradient(160deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,.045) 100%);
    border:1px solid var(--glass-brd);
    box-shadow:
      0 24px 60px rgba(2,6,23,.55),
      inset 0 1px 0 rgba(255,255,255,.14);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    animation:rise .85s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(20px) scale(.98)}
    to{opacity:1; transform:none}
  }

  .planet{
    display:block;
    margin:0 auto 14px;
    filter:drop-shadow(0 0 18px rgba(139,92,246,.55));
    animation:float-y 6s ease-in-out infinite;
  }
  @keyframes float-y{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-7px)}
  }

  .overline{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:11px; font-weight:700; letter-spacing:.3em;
    text-transform:uppercase; color:#a5b4fc;
  }
  .overline svg{flex:0 0 auto}

  h1{
    margin:12px 0 8px;
    text-align:center;
    font-size:27px; font-weight:700; letter-spacing:.01em;
    background:linear-gradient(92deg, #e0e7ff 10%, #cffafe 60%, #e9d5ff 95%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .desc{
    text-align:center;
    font-size:14px; line-height:1.65; color:var(--muted);
    margin-bottom:28px;
  }

  /* ================= FORM ================= */
  .field{margin-bottom:18px}

  .field label{
    display:block;
    font-size:11px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:#b6c2e2;
    margin-bottom:8px;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"]{
    width:100%;
    padding:13px 15px;
    font-size:15px; font-family:inherit;
    color:var(--ink);
    background:var(--field);
    border:1px solid rgba(255,255,255,.14);
    border-radius:12px;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  input::placeholder{color:var(--faint)}
  input:focus{
    outline:none;
    border-color:rgba(139,92,246,.85);
    box-shadow:0 0 0 3px rgba(139,92,246,.28), 0 0 24px rgba(139,92,246,.18);
    background:rgba(6,10,30,.62);
  }

  .row{
    display:flex; justify-content:space-between; align-items:center;
    gap:10px; flex-wrap:wrap;
    margin:4px 0 24px; font-size:13px; color:var(--muted);
  }
  .remember{display:flex; align-items:center; gap:8px; cursor:pointer}
  .remember input{width:15px; height:15px; accent-color:var(--violet); cursor:pointer}

  .link{
    color:#a5f3fc; text-decoration:none; font-weight:600;
    text-shadow:0 0 14px rgba(34,211,238,.35);
  }
  .link:hover{text-decoration:underline}

  .btn{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:14px 16px;
    border:none; border-radius:12px;
    background:linear-gradient(120deg, var(--violet-2) 0%, var(--indigo) 48%, #0891b2 100%);
    background-size:170% 100%;
    color:#fff;
    font-size:14px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; font-family:inherit;
    cursor:pointer;
    box-shadow:0 10px 26px rgba(99,52,237,.38);
    transition:transform .25s ease, box-shadow .25s ease, background-position .5s ease;
  }
  .btn:hover{
    background-position:90% 0;
    transform:translateY(-2px);
    box-shadow:0 16px 36px rgba(99,52,237,.55), 0 0 24px rgba(34,211,238,.25);
  }
  .btn:active{transform:translateY(0)}
  .btn svg{transition:transform .25s ease}
  .btn:hover svg{transform:translateX(4px)}

  .btn:focus-visible,
  .btn-ghost:focus-visible,
  .link:focus-visible{
    outline:3px solid rgba(139,92,246,.5);
    outline-offset:3px;
  }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin:24px 0 18px;
    color:var(--faint); font-size:10.5px;
    text-transform:uppercase; letter-spacing:.22em;
  }
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:rgba(255,255,255,.14)}

  .btn-ghost{
    display:block; text-align:center;
    padding:12px 16px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:12px;
    background:rgba(255,255,255,.05);
    color:#e2e8f0;
    font-weight:600; font-size:13.5px;
    text-decoration:none;
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.11); border-color:rgba(255,255,255,.35)}

  .hint{
    display:flex; gap:8px; align-items:center; justify-content:center;
    margin-top:16px; font-size:12px; color:var(--faint);
  }
  .hint svg{flex:0 0 auto}

  .legal{
    margin-top:18px;
    text-align:center;
    font-size:12px; color:rgba(203,213,225,.55);
    line-height:1.7;
  }
  .legal a{color:rgba(165,243,252,.65); text-decoration:none}
  .legal a:hover{text-decoration:underline}

  /* ================= MOBILE ================= */
  @media (max-width:480px){
    .wrap{padding:32px 16px}
    .card{padding:34px 24px 28px}
    h1{font-size:22px}
    .orb.violet{width:280px; height:280px}
    .orb.cyan{width:250px; height:250px}
  }

  /* Hormati preferensi pengguna yang menonaktifkan animasi */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>

  <!-- Lapisan latar -->
  <div class="bg" role="presentation"></div>
  <div class="veil" role="presentation"></div>
  <div class="stars a" role="presentation"></div>
  <div class="stars b" role="presentation"></div>
  <div class="meteor" role="presentation"></div>
  <div class="orb violet" role="presentation"></div>
  <div class="orb cyan" role="presentation"></div>

  <main class="wrap">
    <section class="card">

      <!-- Planet kecil dengan cincin -->
      <svg class="planet" width="62" height="62" viewBox="0 0 64 64" fill="none" role="img" aria-label="Planet dengan cincin">
        <defs>
          <linearGradient id="pl" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
            <stop stop-color="#a78bfa"/>
            <stop offset=".55" stop-color="#6366f1"/>
            <stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
          <linearGradient id="rg" x1="4" y1="40" x2="60" y2="24" gradientUnits="userSpaceOnUse">
            <stop stop-color="#22d3ee" stop-opacity=".9"/>
            <stop offset="1" stop-color="#a78bfa" stop-opacity=".9"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="15" fill="url(#pl)"/>
        <circle cx="26" cy="27" r="5.5" fill="#fff" opacity=".22"/>
        <ellipse cx="32" cy="33" rx="27" ry="8.5" stroke="url(#rg)" stroke-width="2.4" transform="rotate(-14 32 33)"/>
      </svg>

      <p class="overline">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1l1.8 5.2L15 8l-5.2 1.8L8 15 6.2 9.8 1 8l5.2-1.8L8 1z" fill="#22d3ee"/>
        </svg>
        Portal Galaksi
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1l1.8 5.2L15 8l-5.2 1.8L8 15 6.2 9.8 1 8l5.2-1.8L8 1z" fill="#a78bfa"/>
        </svg>
      </p>

      <h1>Selamat Datang Kembali</h1>
      <p class="desc">Masuk untuk melanjutkan perjalanan eksplorasi Anda menjelajah galaksi.</p>

      <!-- Ubah action="#" sesuai endpoint server Anda -->
      <form action="#" method="post">

        <div class="field">
          <label for="user">Email atau Nama Pengguna</label>
          <input id="user" name="username" type="text" autocomplete="username"
                 placeholder="cth: komandan@galaksi.id" required>
        </div>

        <div class="field">
          <label for="sandi">Kata Sandi</label>
          <input id="sandi" name="password" type="password" autocomplete="current-password"
                 placeholder="Masukkan kata sandi rahasia" required>
        </div>

        <div class="row">
          <label class="remember"><input type="checkbox" name="ingat"> Ingat saya di pesawat ini</label>
          <a href="#" class="link">Lupa kata sandi?</a>
        </div>

        <button type="submit" class="btn">
          Masuk Sekarang
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 8h11M9 3.5L13.5 8 9 12.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

      </form>

      <div class="divider"><span>atau</span></div>
      <a href="#" class="btn-ghost">Buat Akun Penjelajah Baru</a>

      <p class="hint">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 14.5S2.5 11 2.5 6.6C2.5 4.1 4.4 2.5 6.4 2.5c.7 0 1.3.2 1.6.5.3-.3.9-.5 1.6-.5 2 0 3.9 1.6 3.9 4.1C13.5 11 8 14.5 8 14.5z" stroke="#7c89ad" stroke-width="1.3" fill="none"/>
        </svg>
        Data Anda dienkripsi dan disimpan dengan aman
      </p>

    </section>

    <p class="legal">
      &copy; 2026 Galaxy Portal &middot; Dirancang dengan HTML &amp; CSS murni &middot;
      <a href="#">Kebijakan Privasi</a> &middot; <a href="#">Bantuan</a>
    </p>
  </main>

</body>
</html>
