<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ig9ite 3D — Login</title>

  <!-- Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <section class="card">

      <!-- ================= LEFT : LOGIN FORM ================= -->
      <section class="panel panel-form">

        <!-- Dekorasi pudar (seperti di desain) -->
        <span class="deco deco-ring"   aria-hidden="true"></span>
        <span class="deco deco-ring-2" aria-hidden="true"></span>
        <span class="deco deco-ball"   aria-hidden="true"></span>
        <span class="deco deco-stick-1" aria-hidden="true"></span>
        <span class="deco deco-stick-2" aria-hidden="true"></span>

        <a class="logo" href="#">Ig9ite&nbsp;<span>3D</span></a>

        <div class="form-area">
          <header class="form-head">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in by entering your information below</p>
          </header>

          <form id="loginForm" novalidate>

            <div class="field" id="fieldEmail">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="email@example.com"
                autocomplete="email"
              />
              <small class="error-msg" id="emailError" role="alert"></small>
            </div>

            <div class="field" id="fieldPassword">
              <label for="password">Password</label>
              <div class="password-box">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="toggle-pass"
                  id="togglePass"
                  aria-label="Show password"
                  aria-pressed="false"
                  title="Show / hide password"
                >
                  <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
              <small class="error-msg" id="passwordError" role="alert"></small>
            </div>

            <div class="row">
              <label class="remember" for="remember">
                <input type="checkbox" id="remember" checked />
                Remember Me
              </label>
              <a class="forgot" href="#">Forgot Password ?</a>
            </div>

            <button type="submit" class="btn-continue" id="btnContinue">Continue</button>

            <p class="signup">Don&rsquo;t have an account? Create one <a href="#">here</a></p>

          </form>
        </div>

        <p class="credit">@Kufrey Designs</p>
      </section>

      <!-- ================= RIGHT : ILLUSTRATION ================= -->
      <section class="panel panel-art">
        <img src="assets/puppy.png"
             alt="Cute 3D puppy jumping among floating spring, ball and cube shapes" />
      </section>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
