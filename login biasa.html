<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halaman Login</title>

  <!-- Font eksternal (opsional — otomatis pakai font sistem bila offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================
       Halaman Login Sederhana — satu file
       HTML + CSS murni, tanpa JavaScript
       ============================================ */

    /* ---- Reset sederhana ---- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ---- Latar halaman ---- */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Poppins", "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    /* ---- Kartu login ---- */
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 40px 36px 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(23, 20, 69, 0.3);
      text-align: center;
    }

    /* ---- Ikon gembok ---- */
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .logo svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }

    /* ---- Judul ---- */
    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #2d3436;
    }

    .subtitle {
      margin: 6px 0 28px;
      font-size: 0.9rem;
      color: #808e9b;
    }

    /* ---- Formulir ---- */
    form {
      text-align: left;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #2d3436;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .forgot-link {
      font-size: 0.78rem;
      color: #667eea;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      color: #2d3436;
      background: #f5f6fa;
      border: 2px solid transparent;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #b2bec3;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #667eea;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    /* ---- Baris "Ingat saya" ---- */
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      font-size: 0.85rem;
      font-weight: 400;
      color: #636e72;
      cursor: pointer;
    }

    .remember-me input {
      width: 16px;
      height: 16px;
      accent-color: #667eea;
      cursor: pointer;
    }

    /* ---- Tombol masuk ---- */
    .btn-login {
      width: 100%;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.35);
    }

    .btn-login:active {
      transform: translateY(0);
      box-shadow: none;
    }

    /* ---- Tautan daftar ---- */
    .signup-text {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #808e9b;
    }

    .signup-text a {
      color: #667eea;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    /* ---- Layar kecil ---- */
    @media (max-width: 420px) {
      .login-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>

  <main class="login-wrapper">
    <section class="login-card" aria-labelledby="judul-login">

      <!-- Ikon gembok -->
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>

      <h1 id="judul-login">Selamat Datang</h1>
      <p class="subtitle">Silakan masuk untuk melanjutkan</p>

      <form action="#" method="post">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Kata Sandi</label>
            <a href="#" class="forgot-link">Lupa kata sandi?</a>
          </div>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan kata sandi"
            autocomplete="current-password"
            required
          />
        </div>

        <label class="remember-me">
          <input type="checkbox" name="remember" />
          <span>Ingat saya</span>
        </label>

        <button type="submit" class="btn-login">Masuk</button>
      </form>

      <p class="signup-text">
        Belum punya akun? <a href="#">Daftar sekarang</a>
      </p>

    </section>
  </main>

</body>
</html>
